name: build
on:
  push:
    branches: [ "1.21.11" ]
  pull_request:
    branches: [ "1.21.11" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 只需读取仓库内容进行构建和检查

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew # 确保 gradlew 脚本可执行

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4 # 使用最新的稳定版本

    - name: Build with Gradle Wrapper
      run: ./gradlew build # 执行构建命令，确保项目可以编译通过

    # --- 上传构建产物作为 Artifacts ---
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-build-artifacts-${{ github.sha }} # Artifacts 的名称，包含 commit SHA 以方便区分
        path: build/libs/*.jar 
        retention-days: 7 #  Artifacts 的保留天数

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 提交依赖图需要写入权限
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
